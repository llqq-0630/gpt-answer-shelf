<svg xmlns="http://www.w3.org/2000/svg" xmlns:xhtml="http://www.w3.org/1999/xhtml" viewBox="0 0 960 350" aria-label="跨视角生成概念示意图">
  <style>
    svg { display:block;width:100%;height:auto;background:#fff;color:#17252e;font:24px sans-serif }
    .satellite,.generated { fill:#deedf8;stroke:#729abe;stroke-width:3 }
    .generator { fill:#dceee1;stroke:#629b7d;stroke-width:3 }
    .building { fill:#c4a17a }.tree{fill:#73aa8e}.arrow{fill:none;stroke:#17252e;stroke-width:4;marker-end:url(#arrow)}
    .loss{fill:none;stroke:#cd9556;stroke-width:4;stroke-dasharray:9 7}
    text{fill:#17252e;font-size:24px;text-anchor:middle}.label{font-size:28px;fill:#236952}
    .label-box{display:flex;align-items:center;justify-content:center;height:100%;font:26px sans-serif;color:#236952}
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#17252e" stroke-width="1.5"/></marker></defs>
  <rect class="satellite" x="25" y="35" width="250" height="180" rx="14"/>
  <path d="M115 40V210M158 40V210" stroke="#8d9ca7" stroke-width="33"/>
  <path d="M115 42V208M158 42V208" stroke="#fff" stroke-width="4" stroke-dasharray="12 12"/>
  <rect class="building" x="45" y="62" width="47" height="50" rx="4"/><rect class="building" x="208" y="135" width="46" height="59" rx="4"/>
  <circle class="tree" cx="220" cy="72" r="19"/><circle class="tree" cx="70" cy="173" r="19"/>
  <path class="arrow" d="M275 125H360"/>
  <rect class="generator" x="365" y="61" width="230" height="126" rx="20"/>
  <foreignObject x="370" y="69" width="220" height="63"><xhtml:div class="label-box">Generator</xhtml:div></foreignObject>
  <text class="label" x="480" y="166">G</text>
  <path class="arrow" d="M595 125H680"/>
  <rect class="generated" x="685" y="35" width="250" height="180" rx="14"/>
  <path fill="#9fbea7" d="M692 143L746 95 795 133 849 74 928 127V208H692Z"/>
  <path fill="#929faa" d="M758 208L797 143H833L868 208Z"/><path stroke="#fff" stroke-width="4" d="M805 183L814 165 825 183"/>
  <text x="150" y="257">输入卫星图</text><text x="810" y="257">生成地面图</text>
  <path class="loss" d="M150 274V302H810V274"/><text x="480" y="338">与真实地面图比较，计算损失</text>
</svg>
